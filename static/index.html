<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>مسارك - طريقك من الدراسة للوظيفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=1.10.0">
</head>
<body>
<nav id="navbar" class="hidden">
  <header class="topbar">
    <div class="nav-brand">🎓 مسارك</div>
    <div class="nav-user" id="navUser"></div>
    <a href="#" id="logoutBtn" class="logout" aria-label="خروج">خروج</a>
  </header>
  <div class="nav-links tabbar">
    <a href="#/dashboard" data-route="dashboard"><i>🏠</i><span>الرئيسية</span></a>
    <a href="#/feed" data-route="feed"><i>🔥</i><span>وظائف اليوم</span></a>
    <a href="#/jobs" data-route="jobs"><i>💼</i><span>الوظائف</span></a>
    <a href="#/courses" data-route="courses"><i>✨</i><span>مهاراتي</span></a>
    <a href="#/profile" data-route="profile"><i>👤</i><span>ملفي</span></a>
  </div>
</nav>

<main id="app"></main>

<template id="tpl-auth">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>🎓 مسارك</h1>
      <p class="muted">اكتشف الوظائف المناسبة ليك، والمهارات الناقصة، وخطة تعلم توصل بيها لشغلانة أحلامك.</p>
      <div class="tabs">
        <button class="tab active" id="tabLogin">تسجيل الدخول</button>
        <button class="tab" id="tabRegister">حساب جديد</button>
      </div>
      <form id="loginForm">
        <label>البريد الإلكتروني<input type="email" name="email" required></label>
        <label>كلمة المرور<input type="password" name="password" required></label>
        <button class="btn primary" type="submit">دخول</button>
      </form>
      <form id="registerForm" class="hidden">
        <label>الاسم<input type="text" name="name" required></label>
        <label>البريد الإلكتروني<input type="email" name="email" required></label>
        <label>كلمة المرور (8 أحرف على الأقل)<input type="password" name="password" minlength="8" required></label>
        <button class="btn primary" type="submit">إنشاء الحساب</button>
      </form>
      <p class="error" id="authError"></p>
    </div>
  </div>
</template>

<template id="tpl-dashboard">
  <div class="page">
    <h2>لوحة التحكم</h2>
    <div id="dashSummary"></div>
    <h3>الوظائف المقترحة ليك</h3>
    <div id="dashMatches" class="grid"></div>
  </div>
</template>

<template id="tpl-courses">
  <div class="page">
    <h2>مهاراتي</h2>
    <p class="muted">هنا بتضيف <b>المهارات</b> اللي بتعرفها (زي Python أو إكسل أو التصميم). المواقع بتقارن مهاراتك بالوظائف وتقولك الناقص.</p>
    <div class="card addskill">
      <h3>➕ أضف مهارة</h3>
      <p class="muted">ابحث باسم المهارة بالعربي أو الإنجليزي، واضغط عليها عشان تتضاف. <b>مش لازم تكتب اسم مادة أو كورس.</b></p>
      <input type="search" id="skillQ" placeholder="مثال: بايثون، إكسل، تصميم، SQL" enterkeyhint="search" autocomplete="off">
      <div id="skillResults" class="chips pick"></div>
      <p class="success" id="skillMsg"></p>
      <p class="error" id="skillErr"></p>
    </div>
    <h3>✅ مهاراتك الحالية</h3>
    <div id="allSkills" class="chips"></div>
    <details class="card more-opt">
      <summary>مش لاقي المهارة؟ أضف مادة من الجامعة أو كورس خلصته</summary>
      <p class="muted">النظام بيستخرج المهارات من اسم المادة ووصفها. ده اختياري.</p>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="catalogSelect" style="flex:1"></select>
        <button class="btn primary" id="catalogAddBtn">إضافة</button>
      </div>
      <p class="error" id="catalogError"></p>
      <form id="courseForm">
        <label>اسم المادة أو الكورس<input type="text" name="title" required placeholder="مثال: Python Programming and Statistical Analysis"></label>
        <label>الوصف (اختياري)<textarea name="description" rows="3" placeholder="اكتب اللي اتعلمته في جملتين"></textarea></label>
        <input type="hidden" name="kind" value="course">
        <button class="btn primary" type="submit">إضافة وتحليل</button>
      </form>
      <div id="courseResult"></div>
    </details>
    <h3>المواد والكورسات المسجلة</h3>
    <div id="courseList"></div>
  </div>
</template>

<template id="tpl-jobs">
  <div class="page">
    <h2>كل المسارات الوظيفية</h2>
    <p class="muted">اختار أي مسار (فرونت إند، باك إند، ذكاء اصطناعي...) وهتلاقي خطة التعلم الكاملة بالترتيب.</p>
    <div class="chiprow" id="careerCats"></div>
    <div id="careersList" class="grid"></div>
    <h3>الأنسب لمهاراتك</h3>
    <div id="topMatches" class="grid"></div>
  </div>
</template>

<template id="tpl-career">
  <div class="page">
    <a href="#/jobs" class="back-link">→ رجوع للمسارات</a>
    <div id="careerDetail"></div>
  </div>
</template>

<template id="tpl-job-detail">
  <div class="page">
    <a href="#/jobs" class="back-link">→ رجوع للوظائف</a>
    <div id="jobDetail"></div>
  </div>
</template>

<template id="tpl-feed">
  <div class="page">
    <h2>وظائف اليوم</h2>
    <p class="muted" id="feedStatus">...</p>
    <div class="seg" id="feedTabs">
      <button data-t="jobs" class="on">وظائف</button>
      <button data-t="courses">🆓 كورسات مجانية 100%</button>
      <button data-t="paid">💳 كورسات مدفوعة</button>
    </div>
    <div class="notice paid hidden" id="paidNotice"><b>كورسات مدفوعة (Coursera).</b> بتبدأ بتجربة مجانية 7 أيام وبعدها اشتراك مدفوع. موقع مسارك نفسه مجاني، والكورسات دي مفصولة عشان تعرف الفرق. الأفضل تبدأ بالمجانية.</div>
    <div class="notice free hidden" id="freeNotice"><b>كل الكورسات هنا مجانية 100%</b> من البداية للآخر، من مصادر زي Microsoft Learn وfreeCodeCamp وKaggle، ومعاها قوائم يوتيوب ومنصات عربية (دوس "كورسات بالعربي").</div>
    <div class="filters">
      <input type="search" id="feedQ" placeholder="ابحث بالعربي أو الإنجليزي: بايثون، محاسب، تسويق..." enterkeyhint="search">
      <div class="chiprow" id="feedCountry"></div>
      <div class="chiprow" id="feedFields"></div>
      <select id="feedSort"><option value="new">الأحدث</option><option value="match">الأنسب لمهاراتك</option></select>
    </div>
    <div id="feedList" class="list"></div>
    <div id="feedMore" class="more"></div>
    <details class="card"><summary>مصادر البيانات وحدودها</summary><div id="feedSourcesInfo" class="muted"></div></details>
  </div>
</template>

<template id="tpl-feed-detail">
  <div class="page">
    <a href="#/feed" class="back-link">→ رجوع لوظائف اليوم</a>
    <div id="feedDetail"></div>
  </div>
</template>

<template id="tpl-profile">
  <div class="page">
    <h2>ملفي الشخصي</h2>
    <div class="card">
      <form id="profileForm">
        <label>الجامعة<input type="text" name="university"></label>
        <label>الكلية / التخصص<input type="text" name="major"></label>
        <label>السنة الدراسية
          <select name="study_year">
            <option value="">اختر...</option>
            <option>الأولى</option><option>الثانية</option>
            <option>الثالثة</option><option>الرابعة</option><option>خريج</option>
          </select>
        </label>
        <label>الوظيفة المستهدفة<select name="target_job_id" id="targetJobSelect"><option value="">اختر وظيفة...</option></select></label>
        <button class="btn primary" type="submit">حفظ</button>
      </form>
      <p class="success" id="profileMsg"></p>
    </div>
  </div>
</template>

<script src="/app.js?v=1.10.0"></script>
</body>
</html>
