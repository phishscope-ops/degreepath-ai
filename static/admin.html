<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="robots" content="noindex">
<title>مسارك - لوحة المالك</title>
<link rel="stylesheet" href="/style.css">
<style>
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
  .stat { background: #fff; border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  .stat b { display: block; font-size: 1.5rem; color: #4f46e5; }
  .stat span { font-size: .8rem; color: #64748b; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; background: #fff; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
  th { background: #f1f5f9; position: sticky; top: 0; }
  .table-wrap { overflow-x: auto; border-radius: 14px; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  .dayrow { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 1px dashed #e2e8f0; font-size: .85rem; }
</style>
</head>
<body>
<main id="app"></main>

<template id="tpl-login">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>🎓 مسارك</h1>
      <p class="muted">لوحة المالك — خاصة بصاحب المنصة فقط.</p>
      <form id="adminLoginForm">
        <label>كلمة مرور المالك<input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">دخول</button>
      </form>
      <p class="error" id="adminError"></p>
    </div>
  </div>
</template>

<template id="tpl-dash">
  <div class="page">
    <div style="display:flex;align-items:center;gap:10px">
      <h2 style="flex:1">لوحة المالك</h2>
      <button class="btn" id="adminLogout">خروج</button>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="card">
      <h3>التسجيلات في آخر 30 يوم</h3>
      <div id="byDay"></div>
    </div>
    <div class="card">
      <h3>الحسابات المسجلة (<span id="userCount">0</span>)</h3>
      <input type="search" id="userFilter" placeholder="ابحث بالاسم أو البريد أو الجامعة" style="width:100%;margin-bottom:10px">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>الاسم</th><th>البريد</th><th>الجامعة</th><th>التخصص</th>
              <th>السنة</th><th>الوظيفة المستهدفة</th><th>مواد</th><th>مهارات</th><th>تحليلات</th><th>التسجيل</th>
            </tr>
          </thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</template>

<script src="/admin.js"></script>
</body>
</html>
